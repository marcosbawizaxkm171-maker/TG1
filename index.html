<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Трекер привычек</title>
  <!-- Подключение официального скрипта Telegram Web App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-card">
    <!-- Шапка приложения с прогрессом и переключателем темы -->
    <header class="app-header">
      <div class="header-info">
        <div class="header-badge">✓</div>
        <div>
          <h1 class="title">Трекер привычек</h1>
          <span id="progress-text" class="progress-text">Выполнено: 0 из 0</span>
        </div>
      </div>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Переключить тему">
        <span id="theme-icon">🌙</span>
        <span id="theme-label">Тёмная тема</span>
      </button>
    </header>

    <!-- Поле ввода новой привычки и кнопка добавления -->
    <form id="habit-form" class="habit-form">
      <input 
        type="text" 
        id="habit-input" 
        class="habit-input" 
        placeholder="Новая привычка..." 
        autocomplete="off" 
        required
      >
      <button type="submit" id="add-btn" class="habit-btn">+ Добавить</button>
    </form>

    <!-- Контейнер для списка привычек -->
    <div class="habit-list-container">
      <ul id="habit-list" class="habit-list"></ul>
      <p id="empty-state" class="empty-state">Список пуст. Добавьте свою первую привычку!</p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
