<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Трекер привычек</title>
  <!-- Официальный скрипт Telegram Web App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Подключение стилей с версией ?v=7 для сброса кэша Telegram -->
  <link rel="stylesheet" href="style.css?v=7">
</head>
<body>
  <div class="app-card">
    <!-- Шапка приложения с иконкой, названием, прогрессом, серией дней (Streak) и переключателем темы -->
    <header class="app-header">
      <div class="header-left">
        <div class="header-badge" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>
        <div class="header-titles">
          <h1 class="title">Трекер привычек</h1>
          <div class="header-stats">
            <span id="progress-text" class="progress-text">Выполнено: 0 из 0</span>
            <span id="streak-badge" class="streak-badge" title="Серия дней подряд">
              <span class="streak-icon">🔥</span>
              <span id="streak-count">0 дн.</span>
            </span>
          </div>
        </div>
      </div>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Переключить тему">
        <span id="theme-icon">🌙</span>
        <span id="theme-label">Тёмная</span>
      </button>
    </header>

    <!-- Поле ввода новой привычки и кнопка добавления -->
    <form id="habit-form" class="habit-form">
      <input 
        type="text" 
        id="habit-input" 
        class="habit-input" 
        placeholder="Новая привычка..." 
        autocomplete="off" 
        required
      >
      <button type="submit" id="add-btn" class="habit-btn">+ Добавить</button>
    </form>

    <!-- Контейнер для списка привычек -->
    <div class="habit-list-container">
      <ul id="habit-list" class="habit-list"></ul>
      <p id="empty-state" class="empty-state">Список пуст. Добавьте свою первую привычку!</p>
    </div>
  </div>

  <!-- Подключение официальной библиотеки Supabase JS через CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Подключение библиотеки canvas-confetti через CDN для праздничного салюта -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js"></script>
  <!-- Подключение скрипта приложения с версией ?v=7 для сброса кэша Telegram -->
  <script src="app.js?v=7"></script>
</body>
</html>
